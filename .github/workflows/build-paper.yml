name: Build manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/main.tex'
      - 'paper/sections/**'
      - 'paper/figures/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-publishers poppler-utils

      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=manuscript main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=manuscript main.tex
          test "$(pdfinfo manuscript.pdf | awk '/Pages:/ {print $2}')" = "9"

      - name: Commit refreshed PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/manuscript.pdf
          if git diff --cached --quiet; then
            echo "PDF already current"
          else
            git commit -m "Build finalized 9-page TNSM manuscript PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
