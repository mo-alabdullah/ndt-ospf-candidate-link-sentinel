name: ospf-ops

topology:
  groups:
    routers:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      sysctls:
        net.ipv4.ip_forward: 1
    hosts:
      kind: linux
      image: wbitt/network-multitool:3.22.2

  nodes:
    r1:
      group: routers
      binds:
        - ops/r1/daemons:/etc/frr/daemons
        - ops/r1/frr.conf:/etc/frr/frr.conf
    r2:
      group: routers
      binds:
        - ops/r2/daemons:/etc/frr/daemons
        - ops/r2/frr.conf:/etc/frr/frr.conf
    r3:
      group: routers
      binds:
        - ops/r3/daemons:/etc/frr/daemons
        - ops/r3/frr.conf:/etc/frr/frr.conf
    h1:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.11.2/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.11.1 dev eth1
    h2:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.12.2/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.12.1 dev eth1
    h3:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.13.2/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.13.1 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["h1:eth1", "r1:eth3"]
    - endpoints: ["h2:eth1", "r2:eth3"]
    - endpoints: ["h3:eth1", "r3:eth3"]
